[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-powered-ai-agent"
version = "0.1.0"
description = "An MCP server for documents, data, and read-only SQLite queries."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp[cli]>=1.9.0", "python-dotenv>=1.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
llm = ["openai>=1.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["server", "server.tools", "agent", "database", "document_processing", "fine_tuning"]
